<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋招岗位分档</title><meta name="description" content="陈忆盈秋招岗位分档与投递状态"><style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#d9dee5;--text:#18202a;--muted:#647184;--blue:#1769aa;--a:#0b7a53;--b:#b26a00;--c:#687386}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;gap:20px;align-items:end;justify-content:space-between;margin-bottom:16px}h1{font-size:24px;margin:0 0 4px}.meta{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin:14px 0}.card{background:var(--panel);border:1px solid var(--line);padding:14px 16px}.card b{font-size:22px;display:block}.tools{display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);padding:10px}.tools input,.tools select{height:36px;border:1px solid #b9c1cb;background:#fff;padding:0 10px;font:inherit}.tools input{min-width:260px;flex:1}.tablebox{margin-top:10px;background:#fff;border:1px solid var(--line);overflow:auto;max-height:calc(100vh - 260px)}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1320px}th,td{padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#edf1f5;color:#344054;font-weight:600;z-index:2}tr:hover td{background:#f8fbff}.tier{font-weight:700}.tier-A{color:var(--a)}.tier-B{color:var(--b)}.tier-C{color:var(--c)}.status{white-space:nowrap}.note{font-size:13px;color:var(--muted);margin-top:10px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:700px){.wrap{padding:14px}.top{align-items:start;flex-direction:column}.summary{grid-template-columns:repeat(2,1fr)}.tablebox{max-height:none}.tools input{min-width:100%}}
</style></head><body><main class="wrap"><div class="top"><div><h1>秋招岗位分档</h1><div class="meta" id="meta"></div></div><a id="source" target="_blank" rel="noreferrer">打开飞书源表</a></div><section class="summary"><div class="card"><span>全部岗位</span><b id="all">0</b></div><div class="card"><span>A档</span><b id="a">0</b></div><div class="card"><span>B档</span><b id="b">0</b></div><div class="card"><span>C档/不投</span><b id="c">0</b></div></section><section class="tools"><input id="q" placeholder="搜索公司、岗位、行业或地点"><select id="tier"><option value="">全部档位</option><option>A</option><option>B</option><option>C</option></select><select id="industry"><option value="">全部行业</option></select><select id="status"><option value="">全部状态</option></select></section><div class="tablebox"><table><thead><tr><th>档位</th><th>公司</th><th>行业</th><th>岗位</th><th>地点</th><th>匹配理由</th><th>风险/短板</th><th>截止时间</th><th>简历版本</th><th>处理状态</th></tr></thead><tbody id="body"></tbody></table><div class="empty" id="empty" hidden>没有符合条件的岗位</div></div><p class="note" id="note"></p></main><script src="jobs.js"></script><script>
const D=window.JOB_DATA,J=D.jobs,$=x=>document.getElementById(x);$('meta').textContent=`网页更新：${D.updatedAt}｜源表核验至：${D.sourceVerifiedThrough}`;$('source').href=D.sourceUrl;$('note').textContent=D.note;$('all').textContent=J.length;['A','B','C'].forEach(x=>$(x.toLowerCase()).textContent=J.filter(j=>j.tier===x).length);
for(const [id,key] of [['industry','industry'],['status','status']]){[...new Set(J.map(j=>j[key]))].sort().forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;$(id).append(o)})}
function render(){const q=$('q').value.trim().toLowerCase(),t=$('tier').value,i=$('industry').value,s=$('status').value;const out=J.filter(j=>(!q||Object.values(j).join(' ').toLowerCase().includes(q))&&(!t||j.tier===t)&&(!i||j.industry===i)&&(!s||j.status===s));$('body').innerHTML=out.map(j=>`<tr><td class="tier tier-${j.tier}">${j.tier}</td><td><strong>${j.company}</strong></td><td>${j.industry}</td><td>${j.role}</td><td>${j.location}</td><td>${j.reason}</td><td>${j.risk}</td><td>${j.deadline}</td><td>${j.resume}</td><td class="status">${j.status}</td></tr>`).join('');$('empty').hidden=out.length>0}['q','tier','industry','status'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));render();
</script></body></html>
